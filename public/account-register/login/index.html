<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="icon" href="/favicon.ico">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      min-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f6f7f9;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif;
      color: #111827;
    }
    .card {
      width: 100%;
      max-width: 420px;
      margin: 24px;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 20px;
      padding: 28px 32px 32px;
      box-shadow: 0 10px 30px rgba(17, 24, 39, 0.06);
    }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 22px;
      background: #f3f4f6;
      border-radius: 12px;
      padding: 4px;
    }
    .tabs a {
      flex: 1;
      text-align: center;
      text-decoration: none;
      color: #6b7280;
      font-size: 13px;
      font-weight: 600;
      padding: 8px 10px;
      border-radius: 9px;
    }
    .tabs a.active {
      background: #fff;
      color: #111827;
      box-shadow: 0 1px 2px rgba(0,0,0,0.06);
    }
    h1 {
      font-size: 24px;
      letter-spacing: -0.03em;
      margin-bottom: 24px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 8px;
    }
    input {
      width: 100%;
      border: 1px solid #d1d5db;
      background: #f9fafb;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 14px;
      color: #111827;
      margin-bottom: 16px;
    }
    input:focus {
      outline: none;
      background: #fff;
      border-color: #9ca3af;
      box-shadow: 0 0 0 3px #e5e7eb;
    }
    button {
      width: 100%;
      margin-top: 8px;
      background: #111;
      color: #fff;
      border: 0;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #1f2937; }
    a.back {
      display: block;
      text-align: center;
      margin-top: 16px;
      color: #6b7280;
      font-size: 13px;
      text-decoration: none;
    }
    a.back:hover { color: #111827; }
  </style>
</head>
<body>
  <div class="card">
    <div class="tabs">
      <a href="/account-register/login" class="active">Login</a>
    </div>
    <h1>Login</h1>
    <form method="get" action="/">
      <label for="username">Enter your account username.</label>
      <input id="username" name="username" type="text" autocomplete="username" required>
      <label for="password">Enter your account password.</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Login to your account.</button>
    </form>
    <a class="back" href="/">Back to chat</a>
  </div>
</body>
</html>
