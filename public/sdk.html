<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HyperNeural SDK</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:Inter,system-ui,sans-serif;background:#0A0A0B;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}.card{max-width:640px;width:100%;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03);border-radius:20px;padding:32px}h1{font-size:22px;margin-bottom:8px}p{color:rgba(255,255,255,.5);font-size:14px;line-height:1.6}code{display:block;margin-top:16px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);padding:14px;border-radius:10px;font-family:monospace;font-size:13px;word-break:break-all;color:#4ade80}</style></head><body><div class="card"><h1 id="title">HyperNeural SDK</h1><p id="desc">Use this SDK to embed the model in your project.</p><code id="code">loading...</code></div><script>var m=location.pathname.split('/').filter(Boolean)[0]||'inferforge';var u=(location.hash.match(/@([^/]+)/)||[])[1]||'user';document.getElementById('title').textContent=m+' SDK';document.getElementById('desc').textContent='Model: '+m+' · Owner: @'+u;document.getElementById('code').textContent='pip install inferforge --index-url https://hyperneural.cfd/pypi/simple/\n# model: '+m+'\n# user: @'+u+'\nforge pull '+m;</script></body></html>
