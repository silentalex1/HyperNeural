site_name: InferForge Documentation
site_description: Documentation for InferForge - A faster local LLM runtime
site_author: InferForge Team
site_url: https://inferforge.github.io/inferforge

repo_name: inferforge/inferforge
repo_url: https://github.com/inferforge/inferforge
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    # Light mode
    - scheme: default
      primary: deep orange
      accent: orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - scheme: slate
      primary: deep orange
      accent: orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotation
    - content.code.copy
  font:
    text: Inter
    code: Fira Code
  icon:
    logo: material/fire
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quick Start: getting-started/quickstart.md
      - Configuration: getting-started/configuration.md
  - User Guide:
      - CLI Commands: guide/cli-commands.md
      - Model Management: guide/model-management.md
      - Training Models: guide/training.md
      - Chat Interface: guide/chat.md
      - Agent Tools: guide/agent-tools.md
      - Nexara Language: guide/nexara.md
  - Advanced:
      - Architecture: advanced/architecture.md
      - Backend Selection: advanced/backends.md
      - Performance Tuning: advanced/performance.md
      - Security: advanced/security.md
      - Remote Deployment: advanced/deployment.md
  - Tutorials:
      - Train Your First Model: tutorials/first-model.md
      - Build a Coding Assistant: tutorials/coding-assistant.md
      - Custom Nexara Training: tutorials/nexara-training.md
      - API Integration: tutorials/api-integration.md
  - API Reference:
      - CLI API: api/cli.md
      - Python API: api/python.md
      - REST API: api/rest.md
      - WebSocket API: api/websocket.md
  - Development:
      - Contributing: development/contributing.md
      - Testing: development/testing.md
      - Release Process: development/releases.md
  - About:
      - Changelog: about/changelog.md
      - License: about/license.md
      - FAQ: about/faq.md

plugins:
  - search:
      separator: '[\s\-,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_root_heading: true
            show_source: true
            heading_level: 2
  - minify:
      minify_html: true

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tasklist:
      custom_checkbox: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/inferforge/inferforge
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/inferforge/
    - icon: fontawesome/brands/discord
      link: https://discord.gg/inferforge
  version:
    provider: mike
    default: stable

extra_css:
  - stylesheets/extra.css

copyright: Copyright &copy; 2024 InferForge Team
