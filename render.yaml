services:
  - type: web
    name: inferforge-api
    runtime: python
    plan: starter
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt && pip install .
    startCommand: python -m uvicorn inferforge.server.api:app --host 0.0.0.0 --port $PORT --workers 2
    healthCheckPath: /health
    envVars:
      - key: INFERFORGE_ENV
        value: production
