version: '3.8'

services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "11435:11435"
    environment:
      - INFERFORGE_ENV=production
      - HOST=0.0.0.0
      - PORT=11435
    volumes:
      - models:/root/.inferforge/models
      - cache:/root/.cache
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11435/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  models:
  cache:
